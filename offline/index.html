<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Canvas</title>
	<!-- Paste your Canvas logo as a base64 data URI in this href once you send it over -->
	<link id="favicon-link" rel="icon" type="image/png" href="" />
	<style>
		:root {
			--text: #fff;
			--top: #1c2027;
			--top-h: 56px;
			--bg: #0d1117;
			--card-bg: rgba(22, 27, 34, 0.55);
			--card-hover: rgba(30, 36, 44, 0.75);
			--border: rgba(255, 255, 255, .13);
			--bg-brightness: 1.0;
			--bg-color: 255, 255, 255;
			--metal: linear-gradient(135deg, #eef1f4 0%, #b8bfc9 20%, #6d7480 40%, #d8dde3 55%, #8b93a0 70%, #f2f4f6 85%, #9aa1ab 100%);
			--metal-flat: linear-gradient(180deg, #e8ebee 0%, #c3c9d1 45%, #9aa1ab 55%, #d0d5db 100%);
			--metal-line: rgba(210, 218, 228, .45);
		}

		*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

		html, body {
			height: 100%;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
			color: var(--text);
			background: var(--bg);
			overflow: hidden;
		}

		/* ═══ LOADING SCREEN ═══ */
		#loading-screen {
			position: fixed;
			inset: 0;
			z-index: 500;
			background: #0a0d13;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: opacity .5s ease, visibility .5s ease;
		}
		#loading-screen.done { opacity: 0; visibility: hidden; pointer-events: none; }

		#loading-center { text-align: center; }
		#loading-title {
			font-size: 1.1rem;
			font-weight: 800;
			letter-spacing: .02em;
			background: var(--metal);
			background-size: 200% auto;
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
			animation: metalShift 3s linear infinite;
			margin-bottom: 8px;
		}
		#loading-percent {
			font-size: 12px;
			color: rgba(255,255,255,.35);
			font-variant-numeric: tabular-nums;
		}

		#loading-bar-track {
			position: fixed;
			left: 0; right: 0; bottom: 0;
			height: 10px;
			background: rgba(255,255,255,.06);
			border-top: 1px solid rgba(255,255,255,.08);
			overflow: visible;
		}
		#loading-bar-fill {
			height: 100%;
			width: 0%;
			background: var(--metal);
			background-size: 200% auto;
			animation: metalShift 2s linear infinite;
			box-shadow: 0 0 12px rgba(216,221,227,.55);
			transition: width .15s linear;
		}
		#loading-walker {
			position: absolute;
			left: 0%;
			bottom: 10px;
			transform: translate(-50%, 0);
			line-height: 1;
			animation: walkerBob .35s ease-in-out infinite alternate;
			transition: left .15s linear;
			filter: drop-shadow(0 2px 3px rgba(0,0,0,.5));
			display: flex;
			align-items: center;
			justify-content: center;
		}
		#loading-walker svg {
			display: block;
			width: 22px;
			height: 22px;
			animation: metalShift 2s linear infinite;
		}
		@keyframes walkerBob {
			from { transform: translate(-50%, 0); }
			to   { transform: translate(-50%, -5px); }
		}

		/* ═══ BACKGROUNDS ═══ */
		#bg-layer {
			position: fixed;
			inset: 0;
			pointer-events: none;
			z-index: 1;
			opacity: var(--bg-brightness);
		}

		#space-objects {
			position: absolute;
			inset: 0;
			pointer-events: none;
		}

		.star {
			position: absolute;
			width: 2px;
			height: 2px;
			background: #fff;
			border-radius: 50%;
			animation: twinkle 3s infinite;
		}

		.planet {
			position: absolute;
			border-radius: 50%;
		}

		.planet.earth {
			width: 60px;
			height: 60px;
			background: radial-gradient(circle at 30% 30%, #4da6ff, #003d99);
			box-shadow: inset -3px -3px 10px rgba(0,0,0,0.4), 
						0 0 20px rgba(0,150,255,0.3);
		}

		.planet.mars {
			width: 45px;
			height: 45px;
			background: radial-gradient(circle at 35% 35%, #ff6b4a, #8b3a2c);
			box-shadow: inset -2px -2px 8px rgba(0,0,0,0.3),
						0 0 15px rgba(255,100,50,0.2);
		}

		.planet.jupiter {
			width: 100px;
			height: 100px;
			background: repeating-linear-gradient(90deg,
				#d4a574 0px, #d4a574 4px,
				#c48c51 4px, #c48c51 8px,
				#b37636 8px, #b37636 12px);
			box-shadow: inset -4px -4px 15px rgba(0,0,0,0.4),
						0 0 25px rgba(212,165,116,0.2);
		}

		.planet.saturn {
			width: 75px;
			height: 75px;
			background: radial-gradient(circle at 40% 40%, #f4a460, #cd7f32);
			box-shadow: inset -3px -3px 12px rgba(0,0,0,0.3),
						0 0 20px rgba(244,164,96,0.2);
		}

		.saturn-ring {
			position: absolute;
			border: 3px solid rgba(210,180,140,0.4);
			border-radius: 50%;
			transform: rotateX(75deg);
		}

		.planet.neptune {
			width: 50px;
			height: 50px;
			background: radial-gradient(circle at 35% 35%, #4166f5, #0047ab);
			box-shadow: inset -2px -2px 8px rgba(0,0,0,0.3),
						0 0 18px rgba(65,102,245,0.25);
		}

		.nebula {
			position: absolute;
			border-radius: 50%;
			opacity: 0.15;
			filter: blur(40px);
			animation: nebulaPulse 8s ease-in-out infinite;
		}

		.nebula.purple {
			background: radial-gradient(circle, #9d00ff, transparent);
		}

		.nebula.blue {
			background: radial-gradient(circle, #0099ff, transparent);
		}

		@keyframes twinkle {
			0%, 100% { opacity: 0.3; }
			50% { opacity: 1; }
		}

		@keyframes nebulaPulse {
			0%, 100% { opacity: 0.1; transform: scale(1); }
			50% { opacity: 0.25; transform: scale(1.1); }
		}

		#bg-layer.stars {
			background: linear-gradient(180deg, #000814 0%, #001d3d 25%, #003566 50%, #001d3d 75%, #000814 100%);
			position: relative;
			overflow: hidden;
		}

		#bg-layer.grid {
			background-image: linear-gradient(rgba(120,170,255,.22) 1px, transparent 1px),
				linear-gradient(90deg, rgba(120,170,255,.22) 1px, transparent 1px);
			background-size: 42px 42px, 42px 42px;
			background-color: #0a0d13;
			animation: gridPulse 5s ease-in-out infinite;
		}

		#bg-layer.aurora {
			background: #060810 linear-gradient(180deg,
				rgba(0,0,0,0) 0%,
				rgba(0,255,200,.06) 20%,
				rgba(120,0,255,.08) 40%,
				rgba(255,0,150,.07) 60%,
				rgba(0,200,255,.06) 80%,
				rgba(0,0,0,0) 100%);
			animation: auroraShift 9s ease-in-out infinite;
		}

		#bg-layer.chrome {
			background: var(--metal);
			background-size: 220% 220%;
			animation: chromeSheen 10s ease-in-out infinite;
		}

		#bg-layer.none { display: none; background: #0d1117; }

		#rain-canvas {
			position: fixed;
			inset: 0;
			pointer-events: none;
			z-index: 1;
			display: none;
		}

		/* ═══ ANIMATIONS ═══ */
		@keyframes gridPulse {
			0%, 100% { opacity: calc(var(--bg-brightness) * 0.6); }
			50% { opacity: var(--bg-brightness); }
		}
		@keyframes auroraShift {
			0% { transform: translateY(0%) scaleX(1); }
			33% { transform: translateY(-5%) scaleX(1.05); }
			66% { transform: translateY(5%) scaleX(0.97); }
			100% { transform: translateY(0%) scaleX(1); }
		}
		@keyframes chromeSheen {
			0% { background-position: 0% 30%; }
			50% { background-position: 100% 70%; }
			100% { background-position: 0% 30%; }
		}
		@keyframes modal-pop {
			from { transform: scale(.88); opacity: 0; }
			to { transform: scale(1); opacity: 1; }
		}
		@keyframes metalShift {
			0% { background-position: 0% 50%; }
			100% { background-position: 200% 50%; }
		}

		/* ═══ TOPBAR ═══ */
		#topbar {
			position: fixed;
			top: 0; left: 0; right: 0;
			height: var(--top-h);
			background: var(--top);
			background-image: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0) 60%);
			z-index: 30;
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 0 16px;
			border-bottom: 1px solid var(--metal-line);
			box-shadow: 0 2px 10px rgba(0,0,0,.35);
		}

		#tab-buttons { display: flex; gap: 8px; flex-shrink: 0; }

		.tab-btn {
			background: rgba(255,255,255,.07);
			border: 1px solid transparent;
			color: rgba(255,255,255,.6);
			padding: 6px 14px;
			border-radius: 6px;
			font-size: 12px;
			font-weight: 600;
			cursor: pointer;
			transition: background .2s, color .2s, border-color .2s;
		}
		.tab-btn:hover { background: rgba(255,255,255,.15); color: rgba(255,255,255,.85); }
		.tab-btn.active {
			background: var(--metal-flat);
			color: #10131a;
			border-color: rgba(255,255,255,.5);
			text-shadow: 0 1px 0 rgba(255,255,255,.4);
		}

		#search-wrap {
			position: relative;
			flex: 1;
			max-width: 520px;
			display: flex;
			align-items: center;
		}

		#search-icon {
			position: absolute;
			left: 14px;
			width: 15px;
			height: 15px;
			color: rgba(255,255,255,.35);
			pointer-events: none;
			transition: color .2s;
		}

		#search {
			width: 100%;
			background: rgba(255,255,255,.07);
			color: var(--text);
			padding: 9px 34px 9px 38px;
			font-size: 14px;
			border-radius: 20px;
			border: 1px solid rgba(255,255,255,.14);
			outline: none;
			transition: border-color .2s, background .2s, box-shadow .2s;
		}
		#search:focus { border-color: rgba(220,225,232,.6); background: rgba(255,255,255,.12); box-shadow: 0 0 0 3px rgba(216,221,227,.12), 0 0 14px rgba(216,221,227,.15); }
		#search:focus ~ #search-icon, #search-wrap.has-text #search-icon { color: rgba(255,255,255,.7); }
		#search::placeholder { color: rgba(255,255,255,.35); }

		#search-clear {
			position: absolute;
			right: 6px;
			width: 24px; height: 24px;
			border-radius: 50%;
			border: none;
			background: rgba(255,255,255,.1);
			color: rgba(255,255,255,.6);
			font-size: 13px;
			cursor: pointer;
			display: none;
			align-items: center;
			justify-content: center;
			transition: background .15s, color .15s, transform .15s;
		}
		#search-clear:hover { background: rgba(255,255,255,.2); color: #fff; transform: scale(1.08); }
		#search-wrap.has-text #search-clear { display: flex; }

		#search-kbd {
			position: absolute;
			right: 8px;
			font-size: 10px;
			font-weight: 700;
			color: rgba(255,255,255,.3);
			background: rgba(255,255,255,.08);
			border: 1px solid rgba(255,255,255,.14);
			border-radius: 4px;
			padding: 2px 5px;
			pointer-events: none;
			transition: opacity .15s;
		}
		#search-wrap.has-text #search-kbd,
		#search-wrap.is-focused #search-kbd { display: none; }

		#search-results-hint {
			position: absolute;
			top: calc(100% + 6px);
			left: 0;
			font-size: 11px;
			color: rgba(255,255,255,.35);
			white-space: nowrap;
		}

		#top-right {
			display: flex;
			align-items: center;
			gap: 10px;
			margin-left: auto;
			flex-shrink: 0;
		}

		#settings-btn, #info-btn {
			width: 36px; height: 36px;
			border-radius: 50%;
			border: 1px solid rgba(255,255,255,.14);
			background: linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.03));
			color: #fff;
			font-size: 16px;
			cursor: pointer;
			display: flex; align-items: center; justify-content: center;
			transition: background .2s, transform .15s;
		}
		#settings-btn:hover, #info-btn:hover { background: linear-gradient(145deg, rgba(255,255,255,.24), rgba(255,255,255,.06)); transform: translateY(-1px); }

		/* ═══ MAIN CONTENT ═══ */
		#main {
			position: fixed;
			top: var(--top-h); left: 0; right: 0; bottom: 0;
			overflow-y: auto;
			background: transparent;
			scrollbar-width: thin;
			scrollbar-color: rgba(255,255,255,.15) transparent;
			z-index: 2;
		}

		#content { padding: 24px 24px 48px; display: block; max-width: 1600px; margin: 0 auto; }
		#content.hidden { display: none; }

		.section-header {
			display: flex;
			align-items: baseline;
			gap: 10px;
			margin-bottom: 14px;
			margin-top: 0;
		}

		.section-title {
			font-size: 1.05rem;
			font-weight: 800;
			letter-spacing: -.2px;
			background: var(--metal);
			background-size: 200% auto;
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
			animation: metalShift 6s linear infinite;
		}

		.section-count {
			font-size: 12px;
			color: rgba(255,255,255,.4);
			font-weight: 400;
		}

		#all-games-section { margin-top: 40px; }

		.card-popular-badge {
			position: absolute;
			top: 6px; left: 6px;
			background: linear-gradient(135deg, #ffd700, #ff8c00);
			color: #000;
			font-size: 9px;
			font-weight: 800;
			padding: 2px 6px;
			border-radius: 4px;
			letter-spacing: .04em;
			text-transform: uppercase;
			z-index: 3;
			box-shadow: 0 1px 4px rgba(0,0,0,.4);
		}

		.section-title-popular {
			display: flex;
			align-items: center;
			gap: 6px;
		}
		.section-title-popular::before { content: '🔥'; -webkit-text-fill-color: initial; font-size: .9rem; }

		#game-list, #popular-list {
			display: grid;
			grid-template-columns: repeat(6, 1fr);
			gap: 20px;
		}

		#no-results {
			display: none;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 60px 20px;
			color: rgba(255,255,255,.4);
			grid-column: 1 / -1;
		}
		#no-results .nr-icon { font-size: 2rem; margin-bottom: 10px; opacity: .5; }
		#no-results.show { display: flex; }

		/* ═══ CARDS ═══ */
		.card {
			background:
				linear-gradient(135deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.02) 35%, rgba(255,255,255,.06) 100%),
				var(--card-bg);
			backdrop-filter: blur(18px) saturate(160%);
			-webkit-backdrop-filter: blur(18px) saturate(160%);
			border-radius: 10px;
			cursor: pointer;
			overflow: hidden;
			border: 1px solid rgba(255,255,255,.16);
			box-shadow:
				inset 0 1px 0 rgba(255,255,255,.3),
				inset 0 -14px 22px -14px rgba(0,0,0,.4),
				0 4px 14px rgba(0,0,0,.3);
			position: relative;
		}

		/* diagonal glossy sheen that sweeps across on hover */
		.card::before {
			content: '';
			position: absolute;
			top: 0; left: -75%;
			width: 45%; height: 100%;
			background: linear-gradient(75deg, transparent, rgba(255,255,255,.14) 45%, rgba(255,255,255,.32) 50%, rgba(255,255,255,.14) 55%, transparent);
			transform: skewX(-18deg);
			pointer-events: none;
			z-index: 3;
		}
		.card:hover::before { left: 130%; transition: left .65s ease; }

		/* thin gradient edge to sell a glass rim */
		.card::after {
			content: '';
			position: absolute;
			inset: 0;
			border-radius: inherit;
			padding: 1px;
			background: linear-gradient(160deg, rgba(255,255,255,.4), rgba(255,255,255,0) 28%, rgba(255,255,255,0) 72%, rgba(255,255,255,.14));
			-webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
			-webkit-mask-composite: xor;
			mask-composite: exclude;
			pointer-events: none;
			z-index: 2;
		}

		.card:hover {
			transform: translateY(-3px) scale(1.02);
			border-color: rgba(220,225,232,.55);
			background:
				linear-gradient(135deg, rgba(255,255,255,.17) 0%, rgba(255,255,255,.04) 35%, rgba(255,255,255,.1) 100%),
				var(--card-hover);
			box-shadow:
				inset 0 1px 0 rgba(255,255,255,.42),
				inset 0 -14px 22px -14px rgba(0,0,0,.45),
				0 10px 28px rgba(0,0,0,.4);
			transition: transform .2s, border-color .2s, background .2s, box-shadow .2s;
		}

		body.glow-on .card:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,.42), 0 0 20px rgba(220,225,232,.35); }
		body.hover-off .card:hover { transform: none !important; }
		body.blur-off .card { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
		body.blur-off .card::before,
		body.blur-off .card::after { display: none; }

		.card-thumb {
			width: 100%;
			aspect-ratio: 16/9;
			position: relative;
			overflow: hidden;
			background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
			border-bottom: 1px solid rgba(255,255,255,.08);
			display: flex; align-items: center; justify-content: center;
		}

		.card-initials {
			position: absolute; inset: 0;
			display: flex; align-items: center; justify-content: center;
			font-size: 1.8rem;
			font-weight: 800;
			color: rgba(255,255,255,.22);
			text-shadow: 0 2px 8px rgba(0,0,0,.4);
			user-select: none;
		}

		.card-info { padding: 8px 10px 10px; }

		.card-name {
			font-size: 13px;
			font-weight: 600;
			color: rgba(255,255,255,.95);
			line-height: 1.3;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.card-name mark {
			background: rgba(216,221,227,.35);
			color: #fff;
			border-radius: 2px;
			padding: 0 1px;
		}

		.card-hint { font-size: 10px; color: rgba(255,255,255,.35); margin-top: 2px; }

		.card-fav {
			position: absolute; top: 6px; right: 6px;
			background: rgba(0,0,0,.5);
			border: none; cursor: pointer;
			width: 28px; height: 28px;
			border-radius: 50%;
			font-size: 14px;
			color: rgba(255,255,255,.5);
			display: flex; align-items: center; justify-content: center;
			opacity: 0;
			transition: opacity .15s, color .15s;
			z-index: 2;
			box-shadow: 0 2px 4px rgba(0,0,0,.3);
		}
		.card:hover .card-fav { opacity: 1; }
		.card-fav.on { opacity: 1 !important; color: #ffd700 !important; }
		.card-fav:hover { color: #ffd700; }

		.request-card { border-style: dashed; border-color: rgba(255,255,255,.25); }
		.request-card:hover { border-color: rgba(220,225,232,.6); }
		.request-thumb { background: rgba(255,255,255,.04); }

		.request-plus {
			font-size: 2.4rem;
			font-weight: 300;
			color: rgba(255,255,255,.35);
			line-height: 1;
			transition: color .2s, transform .2s;
		}
		.request-card:hover .request-plus { color: rgba(255,255,255,.85); transform: scale(1.15); }

		/* ═══ MODALS ═══ */
		.modal {
			display: none;
			position: fixed; z-index: 55; inset: 0;
			background: rgba(0,0,0,.75);
			backdrop-filter: blur(6px);
		}
		.modal.on { display: flex; align-items: center; justify-content: center; }

		.modal-box {
			background: rgba(13,17,23,0.95);
			backdrop-filter: blur(12px);
			padding: 28px;
			border-radius: 14px;
			max-width: 460px; width: 90%;
			color: var(--text);
			border: 1px solid rgba(255,255,255,.15);
		}

		.modal-thumb {
			width: 100%;
			aspect-ratio: 16/9;
			border-radius: 8px;
			overflow: hidden;
			margin-bottom: 18px;
			position: relative;
			background: rgba(255,255,255,.05);
			display: flex; align-items: center; justify-content: center;
		}
		.modal-thumb-title { font-size: 2.5rem; font-weight: 800; color: rgba(255,255,255,.22); }

		.mtrow { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
		.mtrow h2 { flex: 1; font-size: 1.2rem; color: #fff; }

		.mfav { font-size: 22px; background: none; border: none; cursor: pointer; color: rgba(255,255,255,.3); transition: color .2s; padding: 4px; }
		.mfav:hover, .mfav.on { color: #ffd700; }

		.mstat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.1); font-size: 14px; }
		.mstat:last-of-type { border: none; }
		.mstat b { color: rgba(255,255,255,.5); font-weight: 600; }

		.mbtns { display: flex; gap: 10px; margin-top: 18px; justify-content: center; }
		.mbtns button { padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 14px; }
		.mbplay { background: var(--metal-flat); color: #10131a; }
		.mbplay:hover { filter: brightness(1.05); }
		.mbclose { background: rgba(255,255,255,.1); color: var(--text); border: 1px solid rgba(255,255,255,.2); }
		.mbclose:hover { background: rgba(255,255,255,.18); }
	</style>
</head>
<body>
	<div id="loading-screen">
		<div id="loading-center">
			<div id="loading-title">Asher</div>
			<div id="loading-percent">Loading games...</div>
		</div>
		<div id="loading-bar-track">
			<div id="loading-bar-fill"></div>
			<div id="loading-walker">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/></svg>
			</div>
		</div>
	</div>

	<div id="bg-layer" class="grid"></div>

	<div id="topbar">
		<span style="font-weight: 700; font-size: 1rem; letter-spacing: -.5px;">🎮 Asher</span>
		<div style="flex: 1;"></div>
		<div id="search-wrap">
			<svg id="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
				<circle cx="11" cy="11" r="8"></circle>
				<path d="m21 21-4.35-4.35"></path>
			</svg>
			<input type="text" id="search" placeholder="Search games...">
			<button id="search-clear">✕</button>
			<kbd id="search-kbd">⌘K</kbd>
		</div>
	</div>

	<div id="main">
		<div id="content">
			<div class="section-header">
				<h2 class="section-title">All Games</h2>
				<span class="section-count" id="game-count">0 games</span>
			</div>
			<div id="game-list"></div>
			<div id="no-results">
				<div class="nr-icon">🎮</div>
				<p>No games found</p>
			</div>
		</div>
	</div>

	<script>
		let allGames = [];
		const gameList = document.getElementById('game-list');
		const noResults = document.getElementById('no-results');
		const searchInput = document.getElementById('search');
		const gameCount = document.getElementById('game-count');
		const loadingScreen = document.getElementById('loading-screen');
		const loadingPercent = document.getElementById('loading-percent');
		const loadingBar = document.getElementById('loading-bar-fill');
		const loadingWalker = document.getElementById('loading-walker');

		// Game icons mapping
		const gameIcons = {
			'angry': '🐦', 'bird': '🦅', 'car': '🚗', 'chess': '♟️', 'dinosaur': '🦖',
			'duck': '🦆', 'football': '🏈', 'game': '🎮', 'racing': '🏎️', 'soccer': '⚽',
			'tank': '🎯', 'tennis': '🎾', 'zombie': '🧟', 'minecraft': '⛏️', 'flappy': '🦅',
			'subway': '🚇', 'drift': '🏎️', 'cookie': '🍪', 'clicker': '👆', 'miner': '⛏️'
		};

		function getGameIcon(name) {
			const nameLower = name.toLowerCase();
			for (let [key, icon] of Object.entries(gameIcons)) {
				if (nameLower.includes(key)) return icon;
			}
			return '🎮';
		}

		async function loadGames() {
			try {
				const response = await fetch('./');
				const html = await response.text();
				const parser = new DOMParser();
				const doc = parser.parseFromString(html, 'text/html');
				const links = Array.from(doc.querySelectorAll('a[href]'))
					.map(a => a.getAttribute('href'))
					.filter(href => href && /\.(html|htm)$/i.test(href) && href !== 'index.html');

				allGames = [...new Set(links)].map(file => ({
					name: file.replace(/\.(html|htm)$/i, '').replace(/[-_]/g, ' '),
					file: file,
					icon: getGameIcon(file)
				})).sort((a, b) => a.name.localeCompare(b.name));

				renderGames(allGames);
				loadingScreen.classList.add('done');
			} catch (e) {
				console.error('Error loading games:', e);
				gameList.innerHTML = '<div class="no-results" style="grid-column:1/-1"><div class="nr-icon">❌</div><p>Unable to load games</p></div>';
				loadingScreen.classList.add('done');
			}
		}

		function renderGames(games) {
			gameList.innerHTML = games.length ? games.map(g => `
				<a href="./${g.file}" class="card">
					<div class="card-thumb"><div class="card-initials">${g.icon}</div></div>
					<div class="card-info"><div class="card-name">${g.name}</div></div>
				</a>
			`).join('') : '';
			noResults.classList.toggle('show', !games.length);
			gameCount.textContent = `${games.length} game${games.length !== 1 ? 's' : ''}`;
		}

		searchInput.addEventListener('input', (e) => {
			const term = e.target.value.toLowerCase();
			const filtered = allGames.filter(g => g.name.toLowerCase().includes(term));
			renderGames(filtered);
			document.getElementById('search-wrap').classList.toggle('has-text', term.length > 0);
		});

		document.getElementById('search-clear').addEventListener('click', () => {
			searchInput.value = '';
			document.getElementById('search-wrap').classList.remove('has-text');
			renderGames(allGames);
		});

		loadGames();
	</script>
</body>
</html>
